<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Drowsy Detection</title>

    <!-- Bootstrap Core CSS -->
    <link href="../static/asset/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="../static/css/font-awesome.min.css" rel="stylesheet">

    <!-- Animate CSS -->
    <link href="../static/css/animate.css" rel="stylesheet">

    <!-- Owl-Carousel -->
    <link rel="stylesheet" href="../static/css/owl.carousel.css">
    <link rel="stylesheet" href="../static/css/owl.theme.css">
    <link rel="stylesheet" href="../static/css/owl.transitions.css">

    <!-- Custom CSS -->
    <link href="../static/css/style.css" rel="stylesheet">
    <link href="../static/css/responsive.css" rel="stylesheet">

    <!-- Colors CSS -->
    <link rel="stylesheet" type="text/css" href="../static/css/color/green.css">

    <!-- Google Font -->
    <link href='http://fonts.googleapis.com/css?family=Kaushan+Script' rel='stylesheet' type='text/css'>

    <!-- Modernizer js -->
    <script src="../static/js/modernizr.custom.js"></script>

</head>

<body class="index">

    <!-- Navigation -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">

            <div class="navbar-header page-scroll">
                <button type="button" class="navbar-toggle" data-toggle="collapse" 
                        data-target="#bs-example-navbar-collapse-1">
                    <span class="sr-only"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand page-scroll" href="{{ url_for('login') }}">
                    Drowsy Detection
                </a>
            </div>

            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav navbar-right">

                    <li>
                        <a class="page-scroll" href="{{ url_for('login') }}">Home</a>
                    </li>

                    <li>
                        <a class="page-scroll" href="{{ url_for('login') }}">Login</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Home Slider -->
    <section id="page-top">
        <div id="main-slide" class="carousel slide" data-ride="carousel">

            <div class="carousel-inner">
                <div class="item active">
                    <img class="img-responsive" src="../static/images/2.jpg" alt="slider">
                    <div class="slider-content">
                        <div class="col-md-12 text-center">
                            <h1>
                                <span><strong>Detection of </strong> Drowsiness</span>
                            </h1>
                            <p>in Driver using Custom CNN</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Login Form -->
    <section id="service" class="services-section">
        <div class="container">

            <div class="section-title text-center">
                <h3>Login</h3>
            </div>

            <div class="container">
                <div class="section-title">
                    <div class="col-md-6 col-lg-4" style="margin-left:250px">

                        <form action="{{ url_for('login') }}" method="post">
                            <div class="row">

                                <div class="col-md-6 col-lg-4" style="margin-left:200px">

                                    <div class="control-group">
                                        <div class="controls">
                                            <b> Username </b>:
                                            <input type="text" name="username" placeholder="Username">
                                        </div>
                                    </div>
                                    <br>

                                    <div class="control-group">
                                        <div class="controls">
                                            <b> Password </b>:
                                            <input type="password" name="password" placeholder="Password" required>
                                        </div>
                                    </div>

                                    <div class="control-group">
                                        <br>
                                        <div class="controls">
                                            <div class="msg">{{ msg }}</div>
                                            <input type="submit" class="btn btn-primary" value="Login" 
                                                   style="margin-left: 60px">
                                        </div>
                                    </div>

                                </div>

                            </div>
                        </form>

                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        <script>
                            var messages = {{ messages | safe }};
                            for (var i = 0; i < messages.length; i++) {
                                alert(messages[i]);
                            }
                        </script>
                        {% endif %}
                        {% endwith %}

                    </div>
                </div>
            </div>

        </div>
    </section>

    <script src="../static/js/jquery-2.1.1.min.js"></script>
    <script src="../static/asset/js/bootstrap.min.js"></script>
    <script src="../static/js/jquery.easing.1.3.js"></script>
    <script src="../static/js/classie.js"></script>
    <script src="../static/js/owl.carousel.min.js"></script>
    <script src="../static/js/script.js"></script>

</body>
</html>
